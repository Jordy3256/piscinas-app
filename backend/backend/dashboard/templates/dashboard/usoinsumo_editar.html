{% extends base_template|default:"dashboard/base_trabajador.html" %}
{% block title %}Editar consumo{% endblock %}
{% block content %}
<div class="container py-3" style="max-width:720px"><div class="card shadow-sm"><div class="card-body"><h4>✏️ Editar consumo</h4><p class="text-muted"><strong>{{ uso.insumo.nombre }}</strong>{% if uso.trabajador %} · {{ uso.trabajador }}{% endif %}</p><form method="post" class="row g-2">{% csrf_token %}<div class="col-7"><input class="form-control form-control-lg" type="number" step="0.001" name="cantidad" min="0.001" value="{{ uso.cantidad_mostrada }}" required></div><div class="col-5"><select class="form-select form-select-lg" name="unidad"><option value="g" {% if uso.unidad_mostrada == 'g' %}selected{% endif %}>Gramos</option><option value="kg" {% if uso.unidad_mostrada == 'kg' %}selected{% endif %}>Kilogramos</option><option value="ml" {% if uso.unidad_mostrada == 'ml' %}selected{% endif %}>Mililitros</option><option value="l" {% if uso.unidad_mostrada == 'l' %}selected{% endif %}>Litros</option></select></div><div class="col-12 d-flex gap-2 mt-3"><button class="btn btn-primary flex-fill">Guardar</button><a class="btn btn-outline-secondary flex-fill" href="/dashboard/mantenimientos/{{ uso.mantenimiento.id }}/">Cancelar</a></div></form></div></div></div>
{% endblock %}
