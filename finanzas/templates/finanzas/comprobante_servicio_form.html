{% extends "dashboard/base_admin.html" %}{% block title %}Nuevo comprobante{% endblock %}{% block content %}
<div class="container py-4" style="max-width:1050px"><a href="{% url 'finanzas_comprobantes_servicio' %}">← Volver</a><h2 class="my-3">Nuevo comprobante de servicio</h2><div class="alert alert-warning"><b>DOCUMENTO SIN VALIDEZ TRIBUTARIA · NO AUTORIZADO POR EL SRI</b></div><form method="post" class="card p-4">{% csrf_token %}
<div class="row g-3"><div class="col-md-3"><label>Fecha</label><input class="form-control" type="date" name="fecha" value="{{ hoy|date:'Y-m-d' }}" required></div><div class="col-md-5"><label>Nombre / Razón social *</label><input class="form-control" name="cliente_nombre" required></div><div class="col-md-4"><label>Cédula / RUC</label><input class="form-control" name="cliente_identificacion"></div><div class="col-md-6"><label>Dirección</label><input class="form-control" name="cliente_direccion"></div><div class="col-md-3"><label>Teléfono</label><input class="form-control" name="cliente_telefono"></div><div class="col-md-3"><label>Correo</label><input class="form-control" type="email" name="cliente_email"></div></div>
<hr><div class="d-flex justify-content-between"><h5>Detalle</h5><button type="button" class="btn btn-sm btn-outline-primary" onclick="addRow()">+ Agregar línea</button></div><table class="table" id="det"><thead><tr><th>Cant.</th><th>Descripción *</th><th>P. unitario</th><th></th></tr></thead><tbody><tr><td><input class="form-control" type="number" step=".01" name="cantidad[]" value="1.00"></td><td><textarea class="form-control" name="descripcion[]" required></textarea></td><td><input class="form-control" type="number" step=".01" name="precio_unitario[]" value="0.00"></td><td><button type="button" class="btn btn-outline-danger" onclick="this.closest('tr').remove()">×</button></td></tr></tbody></table>
<div class="row g-3"><div class="col-md-4"><label>Descuento</label><input class="form-control" type="number" step=".01" name="descuento" value="0.00"></div><div class="col-md-8"><label>Forma de pago</label><input class="form-control" name="forma_pago"></div><div class="col-12"><label>Observaciones</label><textarea class="form-control" name="observaciones"></textarea></div></div><div class="text-end mt-4"><button class="btn btn-primary">Crear comprobante</button></div></form></div>
<script>function addRow(){let b=document.querySelector('#det tbody'),r=b.rows[0].cloneNode(true);r.querySelector('[name="cantidad[]"]').value='1.00';r.querySelector('[name="descripcion[]"]').value='';r.querySelector('[name="precio_unitario[]"]').value='0.00';b.appendChild(r)}</script>{% endblock %}
