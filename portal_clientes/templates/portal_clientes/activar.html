{% extends 'portal_clientes/base.html' %}{% block content %}<h2>Activar cuenta</h2><p>Utiliza el correo registrado y el código entregado por JVAQUA.</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label>Correo</label><input type="email" name="email" required><label>Código de activación</label><input name="codigo" required><label>Contraseña nueva (mínimo 12 caracteres)</label><input type="password" name="password" minlength="12" required><button>Activar cuenta</button></form><p><a href="{% url 'portal_clientes:ingresar' %}">Ya tengo cuenta</a></p>{% endblock %}
