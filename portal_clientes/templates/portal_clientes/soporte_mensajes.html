{% for m in mensajes_chat %}<div class="chat-row {% if m.es_cliente == es_cliente_actual %}mine{% endif %}"><div class="chat-bubble"><strong>{% if m.es_cliente %}Cliente{% else %}Administración JVAQUA{% endif %}</strong><p>{{ m.contenido|linebreaksbr }}</p><small>{{ m.creado_en|date:'d/m/Y H:i' }}</small></div></div>{% empty %}<p class="chat-empty">No hay mensajes todavía.</p>{% endfor %}
