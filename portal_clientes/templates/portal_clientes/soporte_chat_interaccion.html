<script>
(function(){
 const board=document.getElementById('chat-board'),status=document.getElementById('chat-status');if(!board)return;
 const form=document.getElementById('jv-compose'),input=form.querySelector('[name="archivo"]'),photo=form.querySelector('[data-photo]'),mic=form.querySelector('[data-mic]'),send=form.querySelector('[data-send]'),message=form.querySelector('[name="mensaje"]'),preview=form.querySelector('[data-preview]'),previewText=form.querySelector('[data-preview-text]'),previewMedia=form.querySelector('[data-preview-media]'),clear=form.querySelector('[data-clear]'),recordPanel=form.querySelector('[data-record-panel]'),recordTime=form.querySelector('[data-record-time]'),stop=form.querySelector('[data-stop]'),discard=form.querySelector('[data-discard]');
 const availability=document.querySelector('[data-availability]');let recorder=null,stream=null,chunks=[],recordStart=0,ticker=null,running=false,objectUrl=null,discarding=false;
 function availabilityUpdate(){if(!availability)return;const hour=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'America/Guayaquil',hour:'2-digit',hourCycle:'h23'}).format(new Date()));const active=hour>=8&&hour<19;availability.classList.toggle('online',active);availability.querySelector('[data-label]').textContent=active?'Activo · 08:00 a 19:00':'Inactivo · Atención de 08:00 a 19:00';}availabilityUpdate();setInterval(availabilityUpdate,60000);
 function bottom(){board.scrollTop=board.scrollHeight;}bottom();
 async function refresh(){if(document.hidden||running)return;running=true;try{const r=await fetch(board.dataset.endpoint,{credentials:'same-origin',cache:'no-store',headers:{'X-Requested-With':'XMLHttpRequest'}});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();const near=board.scrollHeight-board.scrollTop-board.clientHeight<120;const old=board.dataset.last||'';if(old!==String(data.ultimo_id)){board.innerHTML=data.html;board.dataset.last=String(data.ultimo_id);if(near||!old)bottom();}if(status)status.textContent='Mensajes sincronizados';}catch(e){if(status)status.textContent='Sin conexión. Reintentando…';}finally{running=false;}}
 setInterval(refresh,5000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});refresh();
 function clearFile(){input.value='';preview.hidden=true;previewMedia.replaceChildren();previewText.textContent='';if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;}}
 function showFile(){const f=input.files&&input.files[0];clearPreviewOnly();if(!f)return;preview.hidden=false;previewText.textContent=f.name+' · '+Math.ceil(f.size/1024)+' KB';if(f.type.startsWith('image/')){objectUrl=URL.createObjectURL(f);const img=document.createElement('img');img.src=objectUrl;img.alt='Vista previa';previewMedia.append(img);}else if(f.type.startsWith('audio/')){objectUrl=URL.createObjectURL(f);const audio=document.createElement('audio');audio.controls=true;audio.src=objectUrl;previewMedia.append(audio);}}
 function clearPreviewOnly(){previewMedia.replaceChildren();if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;}}
 photo.addEventListener('click',()=>input.click());input.addEventListener('change',showFile);clear.addEventListener('click',clearFile);
 function stopTracks(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
 function resetRecording(){clearInterval(ticker);ticker=null;recordPanel.hidden=true;mic.hidden=false;stopTracks();}
 if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){mic.disabled=true;mic.title='El navegador no permite grabar audio';}
 mic.addEventListener('click',async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});const formats=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];const mime=formats.find(x=>MediaRecorder.isTypeSupported(x));recorder=new MediaRecorder(stream,mime?{mimeType:mime}:undefined);chunks=[];discarding=false;recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const cancelled=discarding;resetRecording();if(cancelled)return;const blob=new Blob(chunks,{type:recorder.mimeType});if(!blob.size||blob.size>3*1024*1024){alert('Audio inválido o mayor a 3 MB');return;}const ext=blob.type.includes('mp4')?'m4a':blob.type.includes('ogg')?'ogg':'webm';try{const dt=new DataTransfer();dt.items.add(new File([blob],'audio.'+ext,{type:blob.type}));input.files=dt.files;showFile();}catch(e){alert('Este navegador no permite adjuntar la grabación.');}};recorder.start();recordStart=Date.now();recordTime.textContent='00:00';ticker=setInterval(()=>{const s=Math.floor((Date.now()-recordStart)/1000);recordTime.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s>=90&&recorder?.state==='recording')recorder.stop();},500);mic.hidden=true;recordPanel.hidden=false;}catch(e){resetRecording();alert('No se pudo acceder al micrófono. Comprueba los permisos.');}});
 stop.addEventListener('click',()=>{if(recorder?.state==='recording')recorder.stop();});discard.addEventListener('click',()=>{discarding=true;if(recorder?.state==='recording')recorder.stop();else resetRecording();});
 message.addEventListener('input',()=>{message.style.height='42px';message.style.height=Math.min(message.scrollHeight,130)+'px';});message.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();form.requestSubmit();}});
 form.addEventListener('submit',e=>{if(recorder?.state==='recording'){e.preventDefault();alert('Detén la grabación antes de enviar.');return;}if(!message.value.trim()&&!input.files.length){e.preventDefault();return;}send.disabled=true;});
})();
</script>
