<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal JVAQUA</title><style>*,*:before,*:after{box-sizing:border-box}body{font-family:system-ui,-apple-system,sans-serif;background:#eef5f9;color:#14334a;margin:0;padding:20px 14px}main{max-width:900px;margin:auto;background:white;padding:clamp(18px,4vw,34px);border-radius:18px;box-shadow:0 8px 30px #1232}h1{color:#09689b;font-size:clamp(20px,3vw,27px)}h2{margin-top:10px}label{display:block;margin:15px 0 5px}input{width:100%;padding:12px;border:1px solid #b8cad7;border-radius:8px}button,.btn{display:inline-block;background:#086eab;color:white;border:0;padding:11px 16px;border-radius:8px;margin-top:10px;cursor:pointer;text-decoration:none}a{color:#086eab}.error{color:#a11}.muted{color:#64798b}.card{padding:16px;border:1px solid #dde5ec;border-radius:12px;margin:12px 0}.nav{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}.tag{display:inline-block;border-radius:100px;background:#e7f3fb;padding:4px 10px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.grid .card{margin:0}dl{display:grid;grid-template-columns:1fr 1fr;gap:8px}dt{color:#64798b}dd{margin:0;font-weight:600}@media(max-width:500px){dl{grid-template-columns:1fr}main{padding:18px}}</style></head><body><main><h1>JVAQUA POOL SERVICES</h1>{% if cliente %}<nav class="nav"><a href="{% url 'portal_clientes:inicio' %}">Mis contratos</a><a href="{% url 'portal_clientes:mantenimientos' %}">Mantenimientos</a><a href="{% url 'portal_clientes:proximas_visitas' %}">Próximas visitas</a></nav>{% endif %}{% block content %}{% endblock %}</main></body></html>
