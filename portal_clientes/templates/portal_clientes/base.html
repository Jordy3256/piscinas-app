<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#086bb5"><title>Portal de Clientes | JVAQUA</title>
<style>
:root{--navy:#102e50;--blue:#0875c5;--muted:#667b90;--border:#dfe8f1;--bg:#f2f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--navy);font-size:15px}a{color:#086bb5;text-decoration:none}a:hover{text-decoration:underline}.shell{max-width:1180px;margin:0 auto;padding:24px 20px 70px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 22px;background:white;border:1px solid var(--border);border-radius:20px;box-shadow:0 8px 28px #163a5b0a}.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.3px;font-size:19px}.brand-mark{width:42px;height:42px;display:grid;place-items:center;background:linear-gradient(135deg,#074c9c,#0ca5dc);color:white;border-radius:13px;font-size:18px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:1.4px;font-weight:700}.nav{display:flex;flex-wrap:wrap;gap:8px;padding:15px 0 24px}.nav a{border-radius:12px;padding:10px 15px;font-weight:700;font-size:13px;background:white;border:1px solid var(--border)}.nav a:hover{background:#eaf4ff;text-decoration:none}.page{background:white;border:1px solid var(--border);border-radius:22px;padding:clamp(20px,3vw,32px);box-shadow:0 12px 35px #183b600a}h1,h2,h3{line-height:1.2}h1{font-size:clamp(24px,3vw,34px);margin:0 0 12px}h2{font-size:clamp(21px,2.5vw,28px);margin:6px 0 12px}h3{font-size:17px;margin:0 0 18px}p{line-height:1.55}.muted{color:var(--muted)}.card{padding:20px;border:1px solid var(--border);border-radius:17px;margin:14px 0;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.grid .card{margin:0}.tag{display:inline-block;background:#e9f5ff;color:#09649d;padding:5px 12px;border-radius:30px;font-size:12px;font-weight:700}.btn,button{display:inline-flex;align-items:center;justify-content:center;background:#086fb8;color:white;border:0;border-radius:11px;padding:12px 17px;font-weight:700;cursor:pointer;text-decoration:none;font:inherit}.btn:hover{background:#075b98;color:white;text-decoration:none}label{display:block;margin:14px 0 5px;font-weight:600}input{width:100%;padding:12px;border:1px solid #c7d6e4;border-radius:10px;font:inherit}.error{color:#b42318}dl{display:grid;grid-template-columns:minmax(140px,1fr) minmax(120px,1fr);gap:12px;margin:0}dt{color:var(--muted)}dd{margin:0;font-weight:700}.hero{background:linear-gradient(112deg,#10418d,#098cc8);color:white;border-radius:19px;padding:28px;margin-bottom:22px}.hero h2{color:white}.hero .muted{color:#d9ecfc}.eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800}.section-head{margin:26px 0 14px}.metric{background:#f4f8fd;border-radius:13px;padding:15px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:20px}.notice{background:#edf8f4;border:1px solid #bfe6d5;padding:14px 16px;border-radius:12px;color:#166c4e}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions .btn.secondary{background:#eaf4fc;color:#09598f}.footer{color:var(--muted);font-size:12px;text-align:center;margin-top:20px}@media(max-width:620px){.shell{padding:10px 10px 45px}.topbar{padding:13px}.brand{font-size:16px}.nav{gap:6px;padding:10px 0 14px}.nav a{flex:1;text-align:center;padding:10px 7px;font-size:12px}.page{padding:17px;border-radius:17px}.hero{padding:20px}dl{grid-template-columns:1fr 1fr;gap:10px}dt,dd{font-size:13px}}

:root{--navy:#0c2a4d;--blue:#0875c5;--muted:#657b91;--border:#dce7f3;--bg:#eef4fb;--green:#087e53;--red:#b42334;--orange:#ad6206}
body{background:radial-gradient(ellipse at 15% 0%,#e3f2ff 0%,transparent 38%),linear-gradient(160deg,#f5f9fe,#edf3fb);min-height:100vh}
.shell{max-width:1200px}.topbar{border-radius:22px;box-shadow:0 12px 34px #173d6b0e}.brand-mark{box-shadow:0 7px 17px #0a73ba30}
.account-pill{background:#e8f4ff;color:#075a99;border-radius:100px;padding:8px 15px;font-size:12px;font-weight:800}
.page{border-radius:24px;box-shadow:0 15px 45px #163a5b0b}.hero{background:linear-gradient(115deg,#103d86 0%,#0968b7 55%,#00a0d3 100%);box-shadow:0 15px 30px #0b68b529}
.card{transition:transform .15s ease,box-shadow .15s ease}.card:hover{box-shadow:0 12px 30px #153e6912}
.card-link{display:block;color:inherit}.card-link:hover{text-decoration:none;transform:translateY(-2px)}
.portal-shortcut{position:relative;overflow:hidden;min-height:155px}.portal-shortcut .shortcut-icon{display:grid;place-items:center;width:45px;height:45px;border-radius:14px;background:#e6f3ff;color:#0769b4;font-size:23px;margin-bottom:14px}
.portal-shortcut h3{margin:0 0 8px}.portal-shortcut p{margin:0}
.status-tag{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:6px 12px;font-size:12px;font-weight:800}
.status-realizado{color:#08724d;background:#e1f7ed}.status-cancelado{color:#b42334;background:#ffeaed}.status-pendiente{color:#a65d00;background:#fff0d5}.status-programado{color:#075fa9;background:#e5f2ff}
.visit-card{border-left:5px solid #e59a22;display:flex;align-items:center;justify-content:space-between;gap:15px}
.visit-card.visit-realizado{border-left-color:#18a66e}.visit-card.visit-cancelado{border-left-color:#e04e5d}.visit-card.visit-pendiente{border-left-color:#e59a22}
.visit-date{font-size:18px;font-weight:850}.visit-meta{color:var(--muted);font-size:13px;margin-top:8px}
.visit-action{display:inline-flex;align-items:center;border-radius:10px;background:#e8f3ff;color:#075e9f;padding:10px 13px;font-size:13px;font-weight:800;white-space:nowrap}
.page-intro{margin-bottom:24px}.page-intro p{margin:4px 0 0}
.pagination{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}.pagination a{padding:9px 13px;background:#eaf4ff;border-radius:10px;font-weight:700}
.contract-card{border-left:4px solid #1387cb;background:linear-gradient(120deg,#fff,#f8fbff)}
@media(max-width:620px){.visit-card{align-items:flex-start;flex-direction:column}.visit-action{width:100%;justify-content:center}.account-pill{padding:7px 10px}.portal-shortcut{min-height:130px}}

.jv-support-link{display:inline-flex;align-items:center;gap:7px;background:#eaf4ff;color:#075b98;padding:9px 13px;border-radius:12px;font-weight:800;font-size:13px}.jv-support-badge{display:none;min-width:20px;height:20px;padding:1px 5px;border-radius:12px;background:#d92d20;color:#fff;font-size:11px;text-align:center}.jv-support-badge[data-count]:not([data-count="0"]){display:inline-block}
.jv-bell{position:relative;display:inline-flex;align-items:center;gap:7px;background:#eaf4ff;color:#075b98;padding:9px 13px;border-radius:12px;font-weight:800;font-size:13px}.jv-bell-badge{display:none;min-width:20px;height:20px;padding:1px 5px;border-radius:12px;background:#d92d20;color:white;font-size:11px;text-align:center}.jv-bell-badge[data-count]:not([data-count="0"]){display:inline-block}

/* Fase 8B: cabecera minimalista fija y avisos desplegables */
.shell{padding-top:90px}.topbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(1160px,calc(100% - 24px));z-index:80;padding:10px 16px;border-radius:17px;backdrop-filter:blur(14px)}
.topbar .brand{font-size:16px}.topbar .brand-mark{width:35px;height:35px;border-radius:10px;font-size:13px}.topbar .brand small{font-size:9px}
.portal-top-actions{display:flex;align-items:center;gap:9px}.portal-icon-button{display:inline-flex;align-items:center;justify-content:center;width:43px;height:43px;border:1px solid #dce8f5;border-radius:13px;background:#f0f7ff;color:#13558b;font-size:20px;cursor:pointer;padding:0}.portal-icon-button:hover{background:#deefff}.portal-logout{margin:0}.portal-logout .portal-icon-button{background:#fff1f2;color:#a52b40;border-color:#ffe1e5}
.portal-notification-wrap{position:relative}.portal-notification-panel{position:absolute;right:0;top:calc(100% + 12px);width:min(390px,calc(100vw - 28px));max-height:min(65vh,580px);overflow:auto;background:white;border:1px solid #dbe7f4;border-radius:18px;box-shadow:0 22px 65px #12345630;padding:14px;z-index:90}.portal-notification-panel[hidden]{display:none}.portal-notification-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.portal-notification-list{display:grid;gap:7px}.portal-notification-item{padding:11px;border-radius:12px;border:1px solid #e1ebf4;background:#f7fbff}.portal-notification-item.unread{background:#eaf5ff;border-color:#bedcf7}.portal-notification-item strong{display:block;font-size:13px;color:#173d62}.portal-notification-item p{font-size:12px;margin:5px 0;color:#57718b}.portal-notification-item small{color:#70849b}.portal-notification-item form{margin-top:8px}.portal-notification-item button{padding:7px 10px;font-size:12px}.portal-notification-footer{display:block;margin-top:12px;text-align:center;font-size:12px;font-weight:750}
.jv-bell-badge{position:absolute;right:-5px;top:-6px;min-width:18px;height:18px;border-radius:12px;padding:1px 4px;font-size:10px}
.portal-home-hero{background:linear-gradient(118deg,#103c82,#096fba 60%,#08a9c8);border-radius:21px;padding:22px 25px;color:white;margin-bottom:19px;box-shadow:0 15px 35px #1262a42c}.portal-home-hero h1{margin:0 0 15px;font-size:clamp(22px,3vw,29px);color:white}.portal-visit-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.portal-visit-summary .summary-item{padding:13px 15px;border:1px solid #ffffff30;background:#ffffff19;border-radius:13px}.summary-item span{display:block;color:#d8edff;font-size:12px;margin-bottom:5px}.summary-item strong{font-size:15px}.portal-home-heading{display:flex;align-items:center;justify-content:space-between;margin:20px 0 12px}.portal-home-heading h2{font-size:18px;margin:0}.portal-shortcut{min-height:142px;border:1px solid #e2ebf5;background:linear-gradient(150deg,#fff,#f8fbff)}.portal-shortcut .shortcut-icon{font-size:21px}.portal-shortcut h3{font-size:15px}.portal-shortcut p{font-size:12px}.portal-home-contract{border-left:4px solid #128bd0}.portal-home-contract h3{margin:9px 0}.portal-home-contract .visit-action{margin-top:12px}
@media(max-width:620px){.shell{padding-top:78px}.topbar{top:7px;width:calc(100% - 14px);padding:8px 10px}.topbar .brand{font-size:14px}.topbar .brand-mark{width:32px;height:32px}.portal-icon-button{width:38px;height:38px}.portal-notification-panel{right:-48px}.portal-home-hero{padding:18px}.portal-visit-summary{gap:8px}.portal-visit-summary .summary-item{padding:10px}.summary-item strong{font-size:13px}.portal-shortcut{min-height:126px}}
</style></head><body><div class="shell"><header class="topbar"><a href="{% url 'portal_clientes:inicio' %}" class="brand"><span class="brand-mark">JV</span><span>JVAQUA <small>PORTAL DE CLIENTES</small></span></a>{% if cliente %}<div class="portal-top-actions"><div class="portal-notification-wrap"><button type="button" id="portal-bell" class="portal-icon-button" aria-label="Mostrar notificaciones" aria-expanded="false" aria-controls="portal-notification-panel">🔔<span class="jv-bell-badge" data-jv-notification-count data-count="0" aria-live="polite"></span></button><div id="portal-notification-panel" class="portal-notification-panel" hidden><div class="portal-notification-head"><strong>Notificaciones</strong><button type="button" id="portal-bell-close" class="portal-icon-button" aria-label="Cerrar notificaciones" style="width:28px;height:28px;font-size:15px">✕</button></div><div id="portal-notification-list" class="portal-notification-list"><p class="muted">Cargando avisos…</p></div><a class="portal-notification-footer" href="{% url 'portal_clientes:notificaciones' %}">Ver todas las notificaciones</a></div></div><form class="portal-logout" action="{% url 'portal_clientes:salir' %}" method="post">{% csrf_token %}<button class="portal-icon-button" type="submit" title="Cerrar sesión" aria-label="Cerrar sesión">⇥</button></form></div>{% endif %}</header><main class="page">{% block content %}{% endblock %}</main><footer class="footer">JVAQUA POOL SERVICES · Portal privado de clientes</footer></div>{% if cliente %}<script>
(function(){
 const bell=document.getElementById('portal-bell'),panel=document.getElementById('portal-notification-panel'),list=document.getElementById('portal-notification-list');
 const badge=document.querySelector('[data-jv-notification-count]');
 const endpoint="{% url 'portal_clientes:notificaciones_resumen' %}";
 const csrf=document.querySelector('.portal-logout input[name="csrfmiddlewaretoken"]')?.value||'';
 function text(tag,content,cls){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=content;return el;}
 async function refresh(){if(document.hidden)return;try{const r=await fetch(endpoint,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});if(!r.ok)throw new Error('No disponible');const d=await r.json();const n=Math.max(0,Number(d.total)||0);badge.dataset.count=String(n);badge.textContent=n>99?'99+':String(n);if(panel.hidden)return;list.replaceChildren();if(!d.avisos.length){list.append(text('p','No tienes notificaciones por el momento.','muted'));return;}
 for(const a of d.avisos){const item=text('div','','portal-notification-item'+(a.leida?'':' unread'));item.append(text('strong',a.titulo));item.append(text('p',a.detalle));item.append(text('small',a.fecha));const form=document.createElement('form');form.method='post';form.action=a.url;const input=document.createElement('input');input.type='hidden';input.name='csrfmiddlewaretoken';input.value=csrf;form.append(input);const b=text('button',a.leida?'Ver detalle':'Abrir aviso');b.type='submit';form.append(b);item.append(form);list.append(item);}
 }catch(e){if(!panel.hidden)list.replaceChildren(text('p','No fue posible cargar los avisos. Inténtalo nuevamente.','muted'));}}
 function close(){panel.hidden=true;bell.setAttribute('aria-expanded','false')}
 bell.addEventListener('click',()=>{const open=panel.hidden;panel.hidden=!open;bell.setAttribute('aria-expanded',String(open));if(open){list.replaceChildren(text('p','Cargando avisos…','muted'));refresh()}});
 document.getElementById('portal-bell-close').addEventListener('click',close);
 document.addEventListener('click',e=>{if(!panel.hidden&&!e.target.closest('.portal-notification-wrap'))close()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 refresh();setInterval(refresh,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
})();
</script>{% endif %}</body></html>
